[package]
name = "rawsprite"
version = "0.1.2"
description = "RawSprite pixel-art and sprite editor"
authors = ["RawSprite contributors"]
edition = "2021"

[lib]
name = "rawsprite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
